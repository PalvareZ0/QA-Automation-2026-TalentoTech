<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Modular</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1 id="titulo-principal">Calculadora Modular</h1>
    <p>Ingresa dos números y selecciona la operación:</p>

    <form id="form-calculadora" action="#" method="post">
        <label for="num1">Número 1:</label>
        <input type="number" id="num1" name="num1" required>

        <label for="num2">Número 2:</label>
        <input type="number" id="num2" name="num2" required>

        <fieldset>
            <legend>Operación:</legend>
            <input type="radio" id="op-sumar" name="operacion" value="sumar" checked>
            <label for="op-sumar">Sumar</label>
            
            <input type="radio" id="op-restar" name="operacion" value="restar">
            <label for="op-restar">Restar</label>
            
            <input type="radio" id="op-multiplicar" name="operacion" value="multiplicar">
            <label for="op-multiplicar">Multiplicar</label>
            
            <input type="radio" id="op-dividir" name="operacion" value="dividir">
            <label for="op-dividir">Dividir</label>
        </fieldset>

        <button type="submit" id="btn-calcular" class="btn btn-primary">Calcular</button>
    </form>
</body>
</html>
