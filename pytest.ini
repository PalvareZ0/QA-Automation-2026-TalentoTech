[pytest]
markers =
    smoke: pruebas críticas y rápidas
    exception: casos que validan manejo de errores

    ####

    # --- TESTS DE SUMAR (Parametrizado y Marker Smoke) ---

@pytest.mark.smoke
@pytest.mark.parametrize(
    "a, b, esperado",
    [
        (2, 3, 5),       # Caso normal
        (-1, -1, -2),    # Negativos
        (0, 0, 0),       # Ceros
        (100, -50, 50)   # Mixto
    ]
)
def test_sumar_exitoso(a, b, esperado):
    assert sumar(a, b) == esperado

# --- TESTS DE RESTAR (Parametrizado) ---

@pytest.mark.parametrize(
    "a, b, esperado",
    [
        (10, 5, 5),
        (-5, -5, 0),
        (0, 10, -10)
    ]
)
def test_restar_exitoso(a, b, esperado):
    assert restar(a, b) == esperado

# --- TESTS DE MULTIPLICAR (Usando Fixtures) ---

def test_multiplicar_enteros(numeros_enteros):
    a, b = numeros_enteros
    assert multiplicar(a, b) == 100

def test_multiplicar_decimales(numeros_decimales):
    a, b = numeros_decimales
    # Usamos approx porque 0.1 * 0.2 da 0.020000000000000004 en Python (precisión flotante)
    assert multiplicar(a, b) == pytest.approx(0.02) 

# --- TESTS DE DIVIDIR (Usando Fixtures y Marker Exception) ---

def test_dividir_enteros(numeros_enteros):
    a, b = numeros_enteros
    assert dividir(a, b) == 4

def test_dividir_decimales(numeros_decimales):
    a, b = numeros_decimales
    assert dividir(a, b) == pytest.approx(0.5)

@pytest.mark.exception
def test_dividir_por_cero():
    # Verificamos que dividir por 0 lance un ValueError
    with pytest.raises(ValueError):
        dividir(1, 0)