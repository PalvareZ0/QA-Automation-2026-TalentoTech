[behave]
# Palabras clave de Gherkin en español (Clase 14)
lang = es

# Excluir por defecto los escenarios en progreso
default_tags = ~@wip

# Rutas donde Behave busca features y steps (convención sobre configuración)
paths = features

# Formato por defecto en consola
format = pretty

# Registrar el formatter HTML del paquete behave-html-formatter
# así se puede usar  behave -f html -o reporte.html
[behave.formatters]
html = behave_html_formatter:HTMLFormatter
