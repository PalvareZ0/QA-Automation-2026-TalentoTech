[pytest]
# Dónde buscar tests
testpaths = tests tests_api tests_behave

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores (Clase 4 + 11 + 12)
markers =
    smoke: Tests críticos que deben pasar siempre
    regression: Suite completa de regresión
    login: pruebas de login
    catalogo: pruebas de catálogo
    carrito: pruebas de carrito
    ui: Tests de interfaz de usuario (Selenium)
    api: Tests de API/backend (Requests)
    e2e: Tests end-to-end de ciclo de vida
    bdd: Wrapper de Behave ejecutado desde Pytest
    flaky: Tests inestables con retry automático

# Opciones por defecto: verbose + reporte HTML autocontenido
addopts =
    -v
    --html=reports/pytest_report.html
    --self-contained-html

# Evitar el warning de pytest-html sobre ruta absoluta
log_cli = false
